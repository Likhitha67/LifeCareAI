<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background shadow under heart -->
    <radialGradient id="heartShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Heart Gradients -->
    <radialGradient id="redGlow" cx="42%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff4b68"/>
      <stop offset="45%" stop-color="#e31b38"/>
      <stop offset="85%" stop-color="#b80922"/>
      <stop offset="100%" stop-color="#8a0314"/>
    </radialGradient>
    <linearGradient id="redSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Blue Heart Gradients -->
    <radialGradient id="blueGlow" cx="58%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#28b4ff"/>
      <stop offset="45%" stop-color="#0277fa"/>
      <stop offset="85%" stop-color="#014ac2"/>
      <stop offset="100%" stop-color="#002d8a"/>
    </radialGradient>
    <linearGradient id="blueSheen" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cross drop shadow -->
    <filter id="crossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Text gradient for AI -->
    <linearGradient id="aiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f02438"/>
      <stop offset="100%" stop-color="#c61022"/>
    </linearGradient>

    <clipPath id="leftHeartClip">
      <rect x="300" y="100" width="300" height="420" />
    </clipPath>
    <clipPath id="rightHeartClip">
      <rect x="600" y="100" width="300" height="420" />
    </clipPath>
  </defs>

  <!-- Clean canvas background -->
  <rect width="1200" height="800" fill="#ffffff" />

  <!-- Subtle shadow under heart tip -->
  <ellipse cx="600" cy="485" rx="140" ry="16" fill="url(#heartShadow)" />

  <!-- Heart Container -->
  <g id="heartGroup">
    <!-- Heart Base Path Left Half (Crimson Red) -->
    <!-- Heart overall: centered at x=600, top lobes y~230, peak y~230, tip at (600, 475) -->
    <!-- Full heart path for reference: M 600 475 C 500 410 370 330 370 235 C 370 170 425 125 490 125 C 540 125 580 155 600 190 C 620 155 660 125 710 125 C 775 125 830 170 830 235 C 830 330 700 410 600 475 Z -->

    <!-- Left Heart Lobe -->
    <path d="M 600 475 C 495 410 370 330 370 235 C 370 170 425 125 495 125 C 548 125 585 158 600 195 L 600 475 Z"
          fill="url(#redGlow)" />
    <!-- Left Lobe Highlight / Sheen -->
    <path d="M 600 475 C 495 410 370 330 370 235 C 370 170 425 125 495 125 C 548 125 585 158 600 195 L 600 475 Z"
          fill="url(#redSheen)" />

    <!-- Right Heart Lobe -->
    <path d="M 600 195 C 615 158 652 125 705 125 C 775 125 830 170 830 235 C 830 330 705 410 600 475 L 600 195 Z"
          fill="url(#blueGlow)" />
    <!-- Right Lobe Highlight / Sheen -->
    <path d="M 600 195 C 615 158 652 125 705 125 C 775 125 830 170 830 235 C 830 330 705 410 600 475 L 600 195 Z"
          fill="url(#blueSheen)" />

    <!-- 3D inner curved seam / bevel -->
    <path d="M 600 195 L 600 475" stroke="#000000" stroke-opacity="0.12" stroke-width="2" />

    <!-- Glossy edge bevel on top curves -->
    <path d="M 400 210 C 410 160 455 140 495 140 C 530 140 565 160 580 185"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" filter="blur(2px)"/>
    <path d="M 800 210 C 790 160 745 140 705 140 C 670 140 635 160 620 185"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" filter="blur(2px)"/>

    <!-- Left Heart ECG Waveform (White) -->
    <path d="M 374 348 L 476 348 L 488 375 L 504 316 L 520 375 L 532 334 L 542 348 L 565 348"
          fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Heart ECG Waveform (White) -->
    <path d="M 635 348 L 658 348 L 668 316 L 682 384 L 696 322 L 708 348 L 826 348"
          fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Medical Cross (Bold White with subtle rounded corners & soft shadow) -->
    <g filter="url(#crossShadow)">
      <!-- Vertical bar of cross -->
      <rect x="581" y="278" width="38" height="96" rx="5" ry="5" fill="#ffffff" />
      <!-- Horizontal bar of cross -->
      <rect x="552" y="307" width="96" height="38" rx="5" ry="5" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography: LifeCare AI -->
  <g transform="translate(600, 595)" text-anchor="middle">
    <!-- "Life" in bold blue, "Care" in bold green, "AI" in bold red -->
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-weight="800"
          font-size="112"
          letter-spacing="-1.5">
      <tspan fill="#0060df">Life</tspan><tspan fill="#00a651">Care</tspan><tspan fill="url(#aiRed)" dx="16">AI</tspan>
    </text>
  </g>

  <!-- Subtitle: — Personal-Health & Document Assistant — -->
  <g transform="translate(600, 658)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
          font-weight="600"
          font-size="28"
          fill="#334155"
          letter-spacing="2">
      <tspan fill="#64748b">— </tspan><tspan>Personal-Health &amp; Document Assistant</tspan><tspan fill="#64748b"> —</tspan>
    </text>
  </g>
</svg>
